[project]
name = "verity-engine"
version = "0.0.0"
description = "Verity AI engine (FastAPI + LangGraph). Phase 0: auth skeleton only."
requires-python = ">=3.12"
dependencies = [
  "verity-core",
  "verity-schema",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "cryptography>=44"]

[tool.uv.sources]
verity-core = { workspace = true }
verity-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity_engine"]
