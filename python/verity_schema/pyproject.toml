[project]
name = "verity-schema"
version = "0.0.0"
description = "Pydantic models generated from packages/schema (do not edit)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity_schema"]
