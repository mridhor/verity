[project]
name = "verity-core"
version = "0.0.0"
description = "Shared Python core: JWT verification, principal, logging redaction"
requires-python = ">=3.12"
dependencies = [
  "verity-schema",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "cryptography>=44"]

[tool.uv.sources]
verity-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity_core"]
