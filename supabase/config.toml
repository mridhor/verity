# Local stack for `supabase start` (requires Docker). Production is self-hosted Supabase in
# Jakarta configured through infra/selfhost (same hook, MFA and signing-key settings).
project_id = "verity"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://verity-mridhors-projects.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "https://verity-mridhors-projects.vercel.app/",
  "https://verity-mridhors-projects.vercel.app/**",
  "https://verity-*-mridhors-projects.vercel.app",
  "https://verity-*-mridhors-projects.vercel.app/**",
]
jwt_expiry = 3600
enable_signup = false
# Server-side floor; apps/web/src/lib/password.ts uses the same value.
minimum_password_length = 10
# Asymmetric ES256 keys: generate once with `supabase gen signing-key --algorithm ES256`.

[auth.email]
enable_signup = false

# Token-hash email templates (links work on any device; invites land on /masuk/sandi-baru).
# Supabase refuses template changes on the free tier while the built-in email sender is used,
# so these stay off until a custom SMTP provider is configured (PLAN.md D-10). Until then the
# default templates send a PKCE link, which /auth/konfirmasi also handles (same browser only).
# [auth.email.template.recovery]
# subject = "Atur ulang kata sandi Verity"
# content_path = "./supabase/templates/recovery.html"
#
# [auth.email.template.invite]
# subject = "Undangan ke Verity"
# content_path = "./supabase/templates/invite.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
