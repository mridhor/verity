<h2>Atur ulang kata sandi Verity</h2>
<p>Seseorang meminta pengaturan ulang kata sandi untuk akun {{ .Email }}.</p>
<p><a href="{{ .SiteURL }}auth/konfirmasi?token_hash={{ .TokenHash }}&type=recovery&next=/masuk/sandi-baru">Atur kata sandi baru</a></p>
<p>Tautan ini hanya berlaku sekali dan untuk waktu terbatas. Jika Anda tidak memintanya, abaikan email ini; kata sandi Anda tidak berubah.</p>
